<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0c0d10">
  <title>Sirens</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="modern.css">
  <link rel="stylesheet" href="songs.css">
  <link rel="stylesheet" href="weit.css">
  <link rel="stylesheet" href="spiel.css">
  <link rel="stylesheet" href="live_lab.css">
  <link rel="stylesheet" href="realtime.css">
  <link rel="stylesheet" href="auto_dj.css">
  <link rel="stylesheet" href="stems.css">
  <link rel="stylesheet" href="signal_room.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <a class="sprung" href="#ansicht">Zum Inhalt</a>
  <header class="kopf">
    <a class="marke" href="#/"><img src="logo.svg" alt="" width="26" height="26">Sirens</a>
    <nav aria-label="Hauptnavigation">
      <a href="#/" data-nav="start">Übersicht</a>
      <a href="#/songs" data-nav="songs">Songs</a>
      <a href="#/neu" data-nav="neu">Neuer Auftrag</a>
      <a href="#/mastern" data-nav="mastern">Song bearbeiten</a>
      <a href="#/lab" data-nav="lab">✦ Live Lab</a>
    </nav>
    <button class="theme-switch" id="theme-switch" type="button" aria-label="Dunkles Erscheinungsbild einschalten" aria-pressed="false">☾</button>
  </header>
  <main id="ansicht" tabindex="-1"></main>
  <div id="meldung" class="meldung" role="status" aria-live="polite" hidden></div>
  <aside id="player" class="player" aria-label="Player" hidden>
    <span id="player-titel"></span>
    <audio id="player-audio" controls preload="none"></audio>
    <button type="button" id="player-zu" class="schlicht" aria-label="Player schließen">✕</button>
  </aside>
  <noscript>Diese Seite braucht JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
