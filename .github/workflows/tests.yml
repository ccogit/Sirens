name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests ohne Netz und ohne Datenbank (temporäre Ordner, nachgebauter Musikordner)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
